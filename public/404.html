    .sp { width: 16px; height: 16px; color: var(--accent); animation: pop .5s var(--ease-spring) both, bob 4s ease-in-out .6s infinite; }
    .s1 { right: -10px; top: 0; } .s2 { left: -8px; top: 8px; width: 12px; height: 12px; color: var(--brand); animation-delay: .15s, .8s; }
    h1 { font-size: 26px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
    p { color: var(--text-mid); margin: 0 0 24px; }
    a.btn {
      display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 52px;
      border-radius: var(--radius-md); background: var(--brand-strong); color: #fff; font-weight: 700;
      text-decoration: none; font-size: 18px; transition: transform .16s var(--ease-spring), background-color .2s;
    }
    a.btn:hover { background: var(--brand); }
    a.btn:active { transform: scale(.96); }
    a.btn:focus-visible { outline: 2px solid var(--brand-soft); outline-offset: 3px; }
    small { display: block; margin-top: 16px; color: var(--text-lo); font-size: 14px; }
    @keyframes step { 0%, 100% { opacity: .35; translate: 0 0; } 30% { opacity: 1; translate: 0 -6px; } }
    @keyframes pop { from { opacity: 0; scale: .5; } to { opacity: 1; scale: 1; } }
    @keyframes bob { 50% { translate: 0 -4px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
