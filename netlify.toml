[build]
  command = "npm run build"
  publish = "dist"

# Node 22 for the build and the functions runtime: firebase-admin's token check
# (jwks-rsa 4) require()s the ESM-only jose 6, which needs Node >= 22.12.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Serve Firebase Auth's sign-in helper from our own domain, so Google sign-in's
# redirect fallback works in browsers that block third-party storage.
# Only takes effect once VITE_FIREBASE_AUTH_DOMAIN=danceclasscompanion.com is set
# in Netlify and https://danceclasscompanion.com/__/auth/handler is an authorized
# redirect URI on the Google OAuth client. Harmless until then.
[[redirects]]
  from = "/__/auth/*"
  to = "https://dance-class-companion.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://dance-class-companion.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# Class QR codes (attendance) open /checkin/<slotId>: serve the app, which reads the id from the path.
[[redirects]]
  from = "/checkin/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Android app links (slice 4): must be served as JSON, never cached for long.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
